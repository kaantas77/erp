name: CI

# NOT: Bu hesapta GitHub Actions runner baslatilamiyor (faturalama kilidi).
# Ayni kontroller yerelde `make check` ile ve push oncesi .githooks/pre-push
# ile calisiyor. Hesap acildiginda bu dosya oldugu gibi calisacak.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migration tutarliligi
        run: python manage.py makemigrations --check --dry-run

      - name: Django kontrol
        run: python manage.py check --deploy

      - name: Testler
        run: pytest -q
