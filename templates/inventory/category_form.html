{% extends "base.html" %}
{% block title %}Kategori ekle - {{ brand }}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Kategori ekle</h1>
<div class="card"><div class="card-body">
  <form method="post" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
      <div class="col-md-6">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Kaydet</button>
      <a class="btn btn-link" href="{% url 'inventory:product-list' %}">İptal</a>
    </div>
  </form>
</div></div>
{% endblock %}
