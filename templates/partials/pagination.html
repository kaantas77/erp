{% if is_paginated %}
<nav class="mt-3">
  <ul class="pagination pagination-sm justify-content-center mb-0">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">Önceki</a></li>
    {% else %}
      <li class="page-item disabled"><span class="page-link">Önceki</span></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Sonraki</a></li>
    {% else %}
      <li class="page-item disabled"><span class="page-link">Sonraki</span></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
